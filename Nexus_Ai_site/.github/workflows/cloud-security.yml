name: Cloud security

on:
  push:
    branches: [main]
    paths:
      - 'nexus-cloud-server/**'
  pull_request:
    branches: [main]
    paths:
      - 'nexus-cloud-server/**'

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-cloud-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pip-audit
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app api scripts tests

      - name: pytest
        env:
          NEXUS_CLOUD_SECRET_KEY: test-secret-key-32-characters-long!!
          NEXUS_CLOUD_DATABASE_URL: 'sqlite:///:memory:'
        run: pytest tests/ -q
