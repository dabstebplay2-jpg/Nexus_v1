name: Nexus Browser build

on:
  workflow_dispatch:
  push:
    paths:
      - 'nexus-browser/**'
      - '.github/workflows/nexus-browser-build.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nexus-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nexus-browser/package-lock.json
      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run build:renderer
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: NexusBrowser-Windows
          path: |
            nexus-browser/dist/NexusBrowser-*-Portable.exe
            nexus-browser/dist/NexusBrowser-*-Setup.exe
          if-no-files-found: error

