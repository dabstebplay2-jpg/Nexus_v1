# Основной авто-пост делает Vercel production build:
# frontend/vercel.json -> npm run changelog:notify:on-deploy.
# Этот workflow оставлен только как ручной fallback, чтобы не плодить дубли в #signal.
name: Discord changelog

on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (minimal)
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts

      - name: Post to Discord
        env:
          CI: 'true'
          FORCE_CHANGELOG_NOTIFY: '1'
          DISCORD_CHANGELOG_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}
        run: npm run changelog:notify
