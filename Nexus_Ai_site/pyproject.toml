[project]
name = "nexus-ide"
version = "0.1.0"
description = "Nexus IDE monorepo"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["backend", "nexus-cloud-server", "nexus-backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/app/routers/ai.py" = ["E501"]
